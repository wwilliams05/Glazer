name: Market snapshots

on:
  schedule:
    - cron: "*/15 * * * *"  # GitHub may delay or skip runs under load; gaps are expected
  workflow_dispatch:  # "Run workflow" button for manual runs

# Never run two snapshots at once; a slow run just delays the next one.
concurrency:
  group: market-snapshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m luka.ingest.markets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: luka
